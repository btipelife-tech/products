<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>製品一覧</title>
  <meta name="description" content="個人開発の製品一覧です。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">PRODUCTS</p>
      <h1>製品一覧</h1>
      <p class="lead">日々の暮らしを少しだけ整える、小さな製品を公開しています。</p>
    </header>

    <section class="grid" aria-label="製品一覧">
      <a class="card" href="./products/meguri/">
        <div class="badge">公開準備中</div>
        <div class="product-mark">MEGURI</div>
        <h2>MEGURI ライフログ</h2>
        <p>記録を通して、自分で自分を発見するためのライフログ。</p>
        <span class="link">詳しく見る →</span>
      </a>

      <!--
      新製品を追加するときは、この card ブロックを複製してリンク先を変更してください。

      <a class="card" href="./products/new-product/">
        <div class="badge">NEW</div>
        <div class="product-mark">NEW PRODUCT</div>
        <h2>新製品名</h2>
        <p>新製品の説明。</p>
        <span class="link">詳しく見る →</span>
      </a>
      -->
    </section>

    <footer>
      <p>© 2026</p>
    </footer>
  </main>
</body>
</html>
